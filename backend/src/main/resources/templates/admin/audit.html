<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>审计日志 - Demeter 管理台</title><link rel="stylesheet" href="/admin/admin.css"></head><body><header><strong>Demeter 管理台</strong><nav><a href="/admin">概览</a><a href="/admin/tenants">租户</a><a href="/admin/users">用户</a><a href="/admin/bills">账单</a><a href="/admin/ocr">OCR</a><a href="/admin/audit">审计</a></nav></header><main><h1>审计日志</h1><table><tr><th>时间</th><th>租户</th><th>操作</th><th>对象</th><th>操作者</th></tr><tr th:each="item : ${page.content}"><td th:text="${item.createdAt}">-</td><td th:text="${item.tenantId}">1</td><td th:text="${item.action}">-</td><td th:text="${item.aggregateType + ' / ' + item.aggregateId}">-</td><td th:text="${item.actorUserId}">-</td></tr></table><nav class="pager"><a th:if="${!page.first}" th:href="@{/admin/audit(page=${page.number - 1})}">上一页</a><span th:text="${page.number + 1}">1</span><a th:if="${!page.last}" th:href="@{/admin/audit(page=${page.number + 1})}">下一页</a></nav></main></body></html>
