<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>审计日志 - Demeter 管理台</title><link rel="stylesheet" th:href="@{/admin/admin.css}"><script th:src="@{/admin/admin.js}" defer></script></head>
<body><header th:replace="~{admin/fragments :: header}"></header><main><h1>审计日志</h1>
<form class="filters" method="get" th:action="@{/admin/audit}"><label>租户 ID<input type="number" min="1" name="tenantId" th:value="${filter.tenantId}"></label><label>操作<input name="action" th:value="${filter.action}" placeholder="如 ADMIN_"></label><label>对象类型<input name="aggregateType" th:value="${filter.aggregateType}"></label><label>对象 ID<input name="aggregateId" th:value="${filter.aggregateId}"></label><button type="submit">查询</button><a th:href="@{/admin/audit}">重置</a></form>
<table><thead><tr><th>时间</th><th>租户</th><th>操作</th><th>对象</th><th>操作者</th><th>Request ID</th></tr></thead><tbody><tr th:each="item : ${page.content}"><td th:text="${item.createdAt}">-</td><td th:text="${item.tenantId}">1</td><td><a th:href="@{/admin/audit/{id}(id=${item.id})}" th:text="${item.action}">-</a></td><td th:text="${item.aggregateType + ' / ' + item.aggregateId}">-</td><td th:text="${item.actorUserId != null ? item.actorUserId : '系统/管理台'}">系统/管理台</td><td th:text="${item.requestId}">-</td></tr><tr th:if="${page.empty}"><td colspan="6" class="empty">没有符合条件的审计日志</td></tr></tbody></table><nav class="pager"><a th:if="${!page.first}" th:href="@{/admin/audit(page=${page.number - 1},tenantId=${filter.tenantId},action=${filter.action},aggregateType=${filter.aggregateType},aggregateId=${filter.aggregateId})}">上一页</a><span th:text="${'第 ' + (page.number + 1) + ' / ' + (page.totalPages == 0 ? 1 : page.totalPages) + ' 页，共 ' + page.totalElements + ' 条'}">1</span><a th:if="${!page.last}" th:href="@{/admin/audit(page=${page.number + 1},tenantId=${filter.tenantId},action=${filter.action},aggregateType=${filter.aggregateType},aggregateId=${filter.aggregateId})}">下一页</a></nav></main></body></html>
