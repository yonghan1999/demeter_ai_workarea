<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${detail.code + ' - Demeter 管理台'}">账单详情</title><link rel="stylesheet" th:href="@{/admin/admin.css}"></head>
<body><header th:replace="~{admin/fragments :: header}"></header><main>
<p><a th:href="@{/admin/bills}">← 返回账单列表</a></p>
<h1 th:text="${detail.code}">账单</h1>
<section class="stats"><div><b th:text="${detail.amount}">0.00</b><span>账单金额</span></div><div><b th:text="${detail.paidAmount}">0.00</b><span>已收金额</span></div><div><b th:text="${detail.outstandingAmount}">0.00</b><span>未收金额</span></div><div><b th:text="${detail.status}">UNPAID</b><span>状态</span></div></section>
<section class="card detail-grid"><div><b>租户</b><span th:text="${detail.tenantId}">-</span></div><div><b>托运方</b><span th:text="${detail.shipper}">-</span></div><div><b>货物/车辆</b><span th:text="${detail.vehicleCargo}">-</span></div><div><b>运输日期</b><span th:text="${detail.date}">-</span></div><div><b>路线</b><span th:text="${detail.origin + ' → ' + detail.destination}">-</span></div><div><b>截止日期</b><span th:text="${detail.dueDate}">-</span></div><div><b>标签</b><span th:text="${#strings.listJoin(detail.tags, ', ')}">-</span></div><div><b>创建时间</b><span th:text="${detail.createdAt}">-</span></div><div><b>更新时间</b><span th:text="${detail.updatedAt}">-</span></div></section>
<section class="card deletion-detail" th:if="${detail.deletedAt != null}"><h2>删除信息</h2><div class="detail-grid"><div><b>删除时间</b><span th:text="${detail.deletedAt}">-</span></div><div><b>删除者</b><span th:text="${detail.deletedBy != null ? detail.deletedBy : '系统/管理台'}">系统/管理台</span></div><div><b>删除原因</b><span th:text="${detail.deleteReason}">-</span></div></div></section>
<h2>收款流水 <a class="section-link" th:href="@{/admin/payments(billId=${detail.id})}">在收款页查看/冲正</a></h2>
<table><thead><tr><th>ID</th><th>金额</th><th>方式</th><th>状态</th><th>收款时间</th><th>冲正原因</th></tr></thead><tbody><tr th:each="item : ${detail.payments}"><td th:text="${item.id}">-</td><td th:text="${item.amount}">0.00</td><td th:text="${item.method}">-</td><td th:text="${item.status}">-</td><td th:text="${item.paidAt}">-</td><td th:text="${item.reversalReason}">-</td></tr><tr th:if="${#lists.isEmpty(detail.payments)}"><td colspan="6" class="empty">暂无收款流水</td></tr></tbody></table>
<h2>审计记录</h2><table><thead><tr><th>时间</th><th>操作</th><th>操作者</th><th>Request ID</th></tr></thead><tbody><tr th:each="item : ${detail.auditEvents}"><td th:text="${item.createdAt}">-</td><td th:text="${item.action}">-</td><td th:text="${item.actorUserId != null ? item.actorUserId : '系统/管理台'}">-</td><td th:text="${item.requestId}">-</td></tr><tr th:if="${#lists.isEmpty(detail.auditEvents)}"><td colspan="4" class="empty">暂无审计记录</td></tr></tbody></table>
</main></body></html>
