<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>账单 - Demeter 管理台</title><link rel="stylesheet" th:href="@{/admin/admin.css}"><script th:src="@{/admin/admin.js}" defer></script></head>
<body><header th:replace="~{admin/fragments :: header}"></header><main><h1>账单</h1>
<form class="filters" method="get" th:action="@{/admin/bills}"><label>关键词<input name="keyword" th:value="${filter.keyword}" placeholder="账单号或托运方"></label><label>租户 ID<input type="number" min="1" name="tenantId" th:value="${filter.tenantId}"></label><label>状态<select name="status"><option value="">全部</option><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}" th:selected="${value == filter.status}"></option></select></label><label>删除状态<select name="deletion"><option value="ALL" th:selected="${filter.deletion.name() == 'ALL'}">全部</option><option value="ACTIVE" th:selected="${filter.deletion.name() == 'ACTIVE'}">有效</option><option value="DELETED" th:selected="${filter.deletion.name() == 'DELETED'}">已删除</option></select></label><button type="submit">查询</button><a th:href="@{/admin/bills}">重置</a></form>
<p class="success" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p>
<form id="bill-bulk-delete" class="bulk-action" method="post" th:action="@{/admin/bills/batch-delete}" data-confirm="确认删除选中的账单？此操作会一次性提交，失败时全部回滚。"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>批量删除原因<input name="reason" value="管理台批量删除" maxlength="240" required></label><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">删除选中账单</button><span>最多选择 100 笔，必须全部成功。</span></form>
<table><thead><tr><th>选择</th><th>编号</th><th>租户</th><th>托运方</th><th>日期</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="item : ${page.content}"><td><input th:if="${item.deletedAt == null}" type="checkbox" name="billIds" th:value="${item.id}" form="bill-bulk-delete"></td><td><a th:href="@{/admin/bills/{id}(id=${item.id})}" th:text="${item.code}">TR-</a></td><td th:text="${item.tenantId}">1</td><td th:text="${item.shipper}">-</td><td th:text="${item.date}">-</td><td th:text="${item.amount}">0</td><td th:text="${item.deletedAt != null ? '已删除' : item.status}">UNPAID</td><td><form th:if="${item.deletedAt == null}" method="post" th:action="@{/admin/bills/{id}/delete(id=${item.id})}" data-confirm="确认删除此账单？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" value="管理台删除" maxlength="240" required><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">删除</button></form><form th:if="${item.deletedAt != null}" method="post" th:action="@{/admin/bills/{id}/restore(id=${item.id})}" data-confirm="确认恢复此账单？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" value="管理台恢复" maxlength="240" required><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">恢复</button></form></td></tr><tr th:if="${page.empty}"><td colspan="8" class="empty">没有符合条件的账单</td></tr></tbody></table>
<nav class="pager"><a th:if="${!page.first}" th:href="@{/admin/bills(page=${page.number - 1},keyword=${filter.keyword},tenantId=${filter.tenantId},status=${filter.status},deletion=${filter.deletion})}">上一页</a><span th:text="${'第 ' + (page.number + 1) + ' / ' + (page.totalPages == 0 ? 1 : page.totalPages) + ' 页，共 ' + page.totalElements + ' 条'}">1</span><a th:if="${!page.last}" th:href="@{/admin/bills(page=${page.number + 1},keyword=${filter.keyword},tenantId=${filter.tenantId},status=${filter.status},deletion=${filter.deletion})}">下一页</a></nav></main></body></html>
