<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>管理台概览</title><link rel="stylesheet" th:href="@{/admin/admin.css}"></head><body><header th:replace="~{admin/fragments :: header}"></header><main><h1>运营概览</h1><section class="stats"><div><b th:text="${dashboard.tenantCount}">0</b><span>租户</span></div><div><b th:text="${dashboard.userCount}">0</b><span>用户</span></div><div><b th:text="${dashboard.billCount}">0</b><span>有效账单</span></div><div><b th:text="${dashboard.unpaidBills}">0</b><span>未支付</span></div><div><b th:text="${dashboard.partiallyPaidBills}">0</b><span>部分支付</span></div></section><h2>OCR 任务</h2><table><tr><th>状态</th><th>数量</th></tr><tr th:each="entry : ${dashboard.ocrCounts}"><td th:text="${entry.key}">PENDING</td><td th:text="${entry.value}">0</td></tr></table></main></body></html>
