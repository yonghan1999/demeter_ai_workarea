<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>管理台概览</title><link rel="stylesheet" href="/admin/admin.css"></head><body><header><strong>Demeter 管理台</strong><nav><a href="/admin">概览</a><a href="/admin/tenants">租户</a><a href="/admin/users">用户</a><a href="/admin/bills">账单</a><a href="/admin/ocr">OCR</a><a href="/admin/audit">审计</a></nav><form method="post" action="/admin/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link">退出</button></form></header><main><h1>运营概览</h1><section class="stats"><div><b th:text="${dashboard.tenantCount}">0</b><span>租户</span></div><div><b th:text="${dashboard.userCount}">0</b><span>用户</span></div><div><b th:text="${dashboard.billCount}">0</b><span>有效账单</span></div><div><b th:text="${dashboard.unpaidBills}">0</b><span>未支付</span></div><div><b th:text="${dashboard.partiallyPaidBills}">0</b><span>部分支付</span></div></section><h2>OCR 任务</h2><table><tr><th>状态</th><th>数量</th></tr><tr th:each="entry : ${dashboard.ocrCounts}"><td th:text="${entry.key}">PENDING</td><td th:text="${entry.value}">0</td></tr></table></main></body></html>
