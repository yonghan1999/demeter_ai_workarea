<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>维护运行 - Demeter 管理台</title><link rel="stylesheet" th:href="@{/admin/admin.css}"></head><body><header th:replace="~{admin/fragments :: header}"></header><main><h1>维护运行记录</h1><p class="warning">此页面只读，维护任务由独立 MAINTENANCE 角色按计划执行；失败后请根据状态和日志处置，不要在 API 容器中手工清理数据。</p><table><thead><tr><th>运行 ID</th><th>状态</th><th>开始时间</th><th>完成时间</th><th>耗时</th><th>清理统计</th><th>失败</th></tr></thead><tbody><tr th:each="item : ${runs}"><td th:text="${item.id}">-</td><td th:text="${item.status}">-</td><td th:text="${item.startedAt}">-</td><td th:text="${item.completedAt}">-</td><td th:text="${item.durationMs != null ? item.durationMs + ' ms' : '-'}">-</td><td th:text="${'会话 ' + item.deletedSessions + '；命令 ' + item.deletedCommandReplays + '；OCR 重试命令 ' + item.deletedOcrRetryCommands + '；OCR 文档 ' + item.deletedOcrDocuments + '；孤儿对象 ' + item.deletedOcrOrphans}">-</td><td><span th:text="${item.failureCount}">0</span><small th:if="${item.failureSummary}" th:text="${item.failureSummary}"></small></td></tr><tr th:if="${#lists.isEmpty(runs)}"><td colspan="7" class="empty">暂无维护运行记录</td></tr></tbody></table></main></body></html>
