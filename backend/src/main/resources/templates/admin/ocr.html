<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>OCR - Demeter 管理台</title><link rel="stylesheet" href="/admin/admin.css"></head><body><header><strong>Demeter 管理台</strong><nav><a href="/admin">概览</a><a href="/admin/tenants">租户</a><a href="/admin/users">用户</a><a href="/admin/bills">账单</a><a href="/admin/ocr">OCR</a><a href="/admin/audit">审计</a></nav></header><main><h1>OCR 任务</h1><table><tr><th>任务 ID</th><th>租户</th><th>状态</th><th>尝试次数</th><th>错误</th><th>创建时间</th></tr><tr th:each="item : ${page.content}"><td th:text="${item.publicId}">-</td><td th:text="${item.tenantId}">1</td><td th:text="${item.status}">PENDING</td><td th:text="${item.attemptCount + '/' + item.maxAttempts}">0/3</td><td th:text="${item.lastErrorCode}">-</td><td th:text="${item.createdAt}">-</td></tr></table></main></body></html>
