<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>OCR - Demeter 管理台</title><link rel="stylesheet" th:href="@{/admin/admin.css}"><script th:src="@{/admin/admin.js}" defer></script></head>
<body><header th:replace="~{admin/fragments :: header}"></header><main><h1>OCR 任务</h1>
<form class="filters" method="get" th:action="@{/admin/ocr}"><label>任务 ID<input name="taskId" th:value="${filter.taskId}"></label><label>租户 ID<input type="number" min="1" name="tenantId" th:value="${filter.tenantId}"></label><label>状态<select name="status"><option value="">全部</option><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}" th:selected="${value == filter.status}"></option></select></label><label>错误码<input name="errorCode" th:value="${filter.errorCode}"></label><button type="submit">查询</button><a th:href="@{/admin/ocr}">重置</a></form>
<p class="success" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p><table><thead><tr><th>任务 ID</th><th>租户</th><th>状态</th><th>尝试次数</th><th>错误</th><th>下次尝试</th><th>更新时间</th><th>操作</th></tr></thead><tbody><tr th:each="item : ${page.content}"><td th:text="${item.publicId}">-</td><td th:text="${item.tenantId}">1</td><td th:text="${item.status}">PENDING</td><td th:text="${item.attemptCount + '/' + item.maxAttempts}">0/3</td><td><span th:text="${item.lastErrorCode}">-</span><small th:if="${item.lastErrorMessage}" th:text="${'：' + item.lastErrorMessage}"></small></td><td th:text="${item.nextAttemptAt}">-</td><td th:text="${item.updatedAt}">-</td><td><form th:if="${item.status == 'FAILED'}" method="post" th:action="@{/admin/ocr/{id}/retry(id=${item.publicId})}" data-confirm="确认重试此 OCR 任务？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" value="管理台重试" maxlength="240" required><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">重试</button></form></td></tr><tr th:if="${page.empty}"><td colspan="8" class="empty">没有符合条件的 OCR 任务</td></tr></tbody></table><nav class="pager"><a th:if="${!page.first}" th:href="@{/admin/ocr(page=${page.number - 1},taskId=${filter.taskId},tenantId=${filter.tenantId},status=${filter.status},errorCode=${filter.errorCode})}">上一页</a><span th:text="${'第 ' + (page.number + 1) + ' / ' + (page.totalPages == 0 ? 1 : page.totalPages) + ' 页，共 ' + page.totalElements + ' 条'}">1</span><a th:if="${!page.last}" th:href="@{/admin/ocr(page=${page.number + 1},taskId=${filter.taskId},tenantId=${filter.tenantId},status=${filter.status},errorCode=${filter.errorCode})}">下一页</a></nav></main></body></html>
