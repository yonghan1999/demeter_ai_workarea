<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>收款 - Demeter 管理台</title><link rel="stylesheet" th:href="@{/admin/admin.css}"><script th:src="@{/admin/admin.js}" defer></script></head>
<body><header th:replace="~{admin/fragments :: header}"></header><main><h1>收款流水</h1>
<form class="filters" method="get" th:action="@{/admin/payments}"><label>流水 ID<input type="number" min="1" name="id" th:value="${filter.id}"></label><label>账单 ID<input type="number" min="1" name="billId" th:value="${filter.billId}"></label><label>租户 ID<input type="number" min="1" name="tenantId" th:value="${filter.tenantId}"></label><label>状态<select name="status"><option value="">全部</option><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}" th:selected="${value == filter.status}"></option></select></label><button type="submit">查询</button><a th:href="@{/admin/payments}">重置</a></form>
<p><a th:href="@{/admin/payment-reconciliation}">查看账本对账异常</a></p><p class="success" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p><table><thead><tr><th>ID</th><th>租户</th><th>账单</th><th>金额</th><th>方式</th><th>状态</th><th>收款时间</th><th>操作</th></tr></thead><tbody><tr th:each="item : ${page.content}"><td th:text="${item.id}">1</td><td th:text="${item.tenantId}">1</td><td th:text="${item.billId}">1</td><td th:text="${item.amount}">0</td><td th:text="${item.method}">-</td><td th:text="${item.status}">ACTIVE</td><td th:text="${item.paidAt}">-</td><td><form th:if="${item.status == 'ACTIVE'}" method="post" th:action="@{/admin/payments/{id}/reverse(id=${item.id})}" data-confirm="确认冲正此收款？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="billId" th:value="${item.billId}"><input name="reason" value="管理台冲正" maxlength="240" required><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">冲正</button></form></td></tr><tr th:if="${page.empty}"><td colspan="8" class="empty">没有符合条件的流水</td></tr></tbody></table><nav class="pager"><a th:if="${!page.first}" th:href="@{/admin/payments(page=${page.number - 1},id=${filter.id},tenantId=${filter.tenantId},billId=${filter.billId},status=${filter.status})}">上一页</a><span th:text="${'第 ' + (page.number + 1) + ' / ' + (page.totalPages == 0 ? 1 : page.totalPages) + ' 页，共 ' + page.totalElements + ' 条'}">1</span><a th:if="${!page.last}" th:href="@{/admin/payments(page=${page.number + 1},id=${filter.id},tenantId=${filter.tenantId},billId=${filter.billId},status=${filter.status})}">下一页</a></nav></main></body></html>
