<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>租户 - Demeter 管理台</title><link rel="stylesheet" th:href="@{/admin/admin.css}"><script th:src="@{/admin/admin.js}" defer></script></head>
<body><header th:replace="~{admin/fragments :: header}"></header><main>
<h1>租户</h1>
<form class="filters" method="get" th:action="@{/admin/tenants}">
    <label>关键词<input name="keyword" th:value="${filter.keyword}" placeholder="名称或公共 ID"></label>
    <label>状态<select name="status"><option value="">全部</option><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}" th:selected="${value == filter.status}"></option></select></label>
    <button type="submit">查询</button><a th:href="@{/admin/tenants}">重置</a>
</form>
<p class="success" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p>
<table><thead><tr><th>ID</th><th>名称</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>
<tr th:each="item : ${page.content}"><td th:text="${item.id}">1</td><td th:text="${item.name}">租户</td><td th:text="${item.status}">ACTIVE</td><td th:text="${item.createdAt}">-</td><td>
<form th:if="${item.status == 'ACTIVE'}" method="post" th:action="@{/admin/tenants/{id}/suspend(id=${item.id})}" data-confirm="确认暂停此租户？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" value="管理台暂停" maxlength="240" required><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">暂停</button></form>
<form th:if="${item.status == 'SUSPENDED'}" method="post" th:action="@{/admin/tenants/{id}/activate(id=${item.id})}" data-confirm="确认恢复此租户？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" value="管理台恢复" maxlength="240" required><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">恢复</button></form>
<form method="post" th:action="@{/admin/tenants/{id}/revoke-sessions(id=${item.id})}" data-confirm="确认撤销此租户全部用户的有效会话？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" value="管理台租户级撤销会话" maxlength="240" required><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">撤销全部会话</button></form>
</td></tr><tr th:if="${page.empty}"><td colspan="5" class="empty">没有符合条件的租户</td></tr></tbody></table>
<nav class="pager"><a th:if="${!page.first}" th:href="@{/admin/tenants(page=${page.number - 1},keyword=${filter.keyword},status=${filter.status})}">上一页</a><span th:text="${'第 ' + (page.number + 1) + ' / ' + (page.totalPages == 0 ? 1 : page.totalPages) + ' 页，共 ' + page.totalElements + ' 条'}">1</span><a th:if="${!page.last}" th:href="@{/admin/tenants(page=${page.number + 1},keyword=${filter.keyword},status=${filter.status})}">下一页</a></nav>
</main></body></html>
