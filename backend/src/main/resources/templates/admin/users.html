<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>用户 - Demeter 管理台</title><link rel="stylesheet" th:href="@{/admin/admin.css}"><script th:src="@{/admin/admin.js}" defer></script></head>
<body><header th:replace="~{admin/fragments :: header}"></header><main>
<h1>用户</h1>
<form class="filters" method="get" th:action="@{/admin/users}">
    <label>用户 ID<input type="number" min="1" name="id" th:value="${filter.id}"></label><label>租户 ID<input type="number" min="1" name="tenantId" th:value="${filter.tenantId}"></label>
    <label>关键词<input name="keyword" th:value="${filter.keyword}" placeholder="昵称或 OpenID"></label><label>状态<select name="status"><option value="">全部</option><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}" th:selected="${value == filter.status}"></option></select></label>
    <button type="submit">查询</button><a th:href="@{/admin/users}">重置</a>
</form>
<p class="success" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p>
<table><thead><tr><th>ID</th><th>租户</th><th>昵称</th><th>状态</th><th>OpenID</th><th>操作</th></tr></thead><tbody><tr th:each="item : ${page.content}"><td th:text="${item.id}">1</td><td th:text="${item.tenantId}">1</td><td th:text="${item.displayName}">-</td><td th:text="${item.status}">ACTIVE</td><td th:text="${item.openId}">-</td><td>
<form th:if="${item.status == 'ACTIVE'}" method="post" th:action="@{/admin/users/{id}/disable(id=${item.id})}" data-confirm="确认禁用此用户？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" value="管理台禁用" maxlength="240" required><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">禁用</button></form>
<form th:if="${item.status == 'DISABLED'}" method="post" th:action="@{/admin/users/{id}/enable(id=${item.id})}" data-confirm="确认启用此用户？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" value="管理台启用" maxlength="240" required><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">启用</button></form>
<form method="post" th:action="@{/admin/users/{id}/revoke-sessions(id=${item.id})}" data-confirm="确认撤销此用户的全部登录会话？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" value="管理台撤销会话" maxlength="240" required><input type="hidden" name="idempotencyKey" th:value="${T(java.util.UUID).randomUUID()}"><button type="submit">撤销会话</button></form>
</td></tr><tr th:if="${page.empty}"><td colspan="6" class="empty">没有符合条件的用户</td></tr></tbody></table>
<nav class="pager"><a th:if="${!page.first}" th:href="@{/admin/users(page=${page.number - 1},id=${filter.id},tenantId=${filter.tenantId},keyword=${filter.keyword},status=${filter.status})}">上一页</a><span th:text="${'第 ' + (page.number + 1) + ' / ' + (page.totalPages == 0 ? 1 : page.totalPages) + ' 页，共 ' + page.totalElements + ' 条'}">1</span><a th:if="${!page.last}" th:href="@{/admin/users(page=${page.number + 1},id=${filter.id},tenantId=${filter.tenantId},keyword=${filter.keyword},status=${filter.status})}">下一页</a></nav>
</main></body></html>
